apiVersion: v1
kind: Service
metadata:
  name: dear-child-service
  namespace: dear-child
  labels:
    app: dear-child-app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: dear-child-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dear-child-ingress
  namespace: dear-child
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # הגנת Rate-Limiting ברמת ה-Ingress בנוסף להגנת האפליקציה
    nginx.ingress.kubernetes.io/limit-rps: "25"
    # הגנת פרטיות (D-24, D-34): מניעת שמירת IP מזהה בלוגי גישה מעבר לנדרש לאבטחה
    nginx.ingress.kubernetes.io/enable-access-log: "false"
spec:
  tls:
    - hosts:
        - yaldihayakar.hasadna.org.il
      secretName: dear-child-tls-cert
  rules:
    - host: yaldihayakar.hasadna.org.il
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dear-child-service
                port:
                  number: 80
