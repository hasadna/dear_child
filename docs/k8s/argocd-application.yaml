apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dear-child
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hasadna/dear_child.git
    targetRevision: main
    path: docs/k8s
    plugin:
      name: argocd-vault-plugin-kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: dear-child
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
